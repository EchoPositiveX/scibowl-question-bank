# Corrections for problems in the source PDFs.
#
# Fix data here, not by editing PDFs or adding special cases to the parser code.
# Every entry needs a `reason` in plain words. It is copied into the question's
# quality.notes, so the website and reviewers can see what was changed.
#
# Two kinds of correction:
#
# extract:   applied while reading the PDF, before the question has an ID.
#            Use these when the PDF prints the wrong number, part or subject,
#            because those change the question's ID.
#            match: fields that must all equal (level, set, round, page, number,
#                   part, subject_raw, style), plus optional question_starts_with.
#            set:   fields to change (number, part, subject_raw, style).
#
# questions: applied to the finished question, matched by ID.
#            Use these for one-off text fixes: a typo, a wrong or missing answer,
#            a broken formula, a wrong format.
#            set: dotted paths to change, e.g. answer.text, question.text,
#                 choices.W.text, format, category, quality.text_status.
#            The parser fails if a correction's ID matches no question, so typos
#            in IDs are caught.

extract:
  - match: {level: ms, set: set02, round: sample_questions_r3, part: bonus, number: 46}
    set: {number: 2}
    reason: The PDF numbers this bonus 46; it belongs with toss-up 2.

  - match: {level: ms, set: set02, round: sample_questions_r6, part: bonus, number: 46}
    set: {number: 4}
    reason: The PDF numbers this bonus 46 and leaves out the ")"; it belongs with toss-up 4.

  - match: {level: ms, set: set02, round: sample_questions_r7, page: 6, number: 10}
    set: {number: 12}
    reason: The PDF prints question 12 as 10 on page 6.

  - match: {level: ms, set: set02, round: sample_questions_r6, page: 6, number: 10}
    set: {number: 12}
    reason: The PDF prints question 12 as 10 on page 6.

  - match: {level: ms, set: set02, round: sample_questions_r8, page: 6, number: 10, part: bonus}
    set: {number: 12}
    reason: The PDF prints bonus 12 as 10 on page 6.

  - match: {level: ms, set: set02, round: sample_questions_r6, page: 4, number: 2, part: bonus}
    set: {number: 8}
    reason: The PDF prints bonus 8 as 2 on page 4.

  - match: {level: ms, set: set10, round: 14A_MS_Reg_2016, page: 8, number: 16, part: tossup}
    question_starts_with: "A discharged capacitor"
    set: {part: bonus}
    reason: The capacitor question is bonus 16, but the PDF labels it as a second toss-up 16.

  - match: {level: ms, set: set13, round: rr5_for_web, number: 16, part: tossup}
    set: {subject_raw: Earth and Space}
    reason: The PDF prints no subject for this question about the zodiac.

  - match: {level: ms, set: set12, round: MSRound-6, number: 12, part: bonus}
    set: {style: Short Answer}
    reason: The PDF labels this Multiple Choice, but it has no choices and a number for an answer.

questions:
  - id: ms-set13-rr2-for-web-q13-tossup
    set: {answer.choice: X, answer.text: "x^10"}
    reason: "The PDF's answer is Y) x^6, but x^8 x^4 / x^2 = x^12 / x^2 = x^10, which is choice X. Confirmed by John on 2026-11-24."

  - id: ms-set04-round4-q21-tossup
    set:
      choices.X.text: "10"
      choices.Y.text: "20"
      answer.text: "20"
      quality.text_status: verified
      quality.flags: []
      quality.notes: []
    reason: "The PDF's choices X and Y and the first digit of the answer are blank embedded images (it prints W) 5, X), Y), Z) 50, ANSWER: Y) 0). Filled in as Y) 20 (20 °C is the accepted minimum for commercial OTEC, and the answer ends in 0). X) 10 is inferred from the 5, ?, ?, 50 ladder and does not affect the answer. Confirmed by John on 2026-11-24."
