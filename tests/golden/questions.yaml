    category: physical_science
    format: multiple_choice
    question: "With which of the following is Brownian motion most directly related:"
    choices:
      W: "thermal energy"
      X: "conservation of mass"
      Y: "Dalton’s law"
      Z: "chemical ionic bonds"
    answer:
      choice: W
      text: "THERMAL ENERGY"

