# Golden questions (QB-05): hand-checked against the printed question images on 2026-11-24.
# tests/test_golden.py parses each one's round and compares these fields.
# Every value here is what the printed question says, not just what the parser gives today.
# `known_issue` marks an entry the parser gets wrong today; that test is expected to fail
# until the parser is fixed (then remove known_issue, and the test must pass).

questions:
