      text: "If a ≠ 0 (read as: a does not equal 0), what is the multiplicative inverse of a?"
      latex: "If $a \\neq 0$ (read as: a does not equal 0), what is the multiplicative inverse of $a$?"
    answer:
      text: "1/a"
      latex: "$\\frac{1}{a}$"
