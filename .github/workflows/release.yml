name: Release

# Publishes a dataset release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# The build parses every PDF with images, validates, runs the content checks,
# and stops without publishing if any of them fail.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Build release files
        run: python -m scibowl_qb.release "${GITHUB_REF_NAME}" --jobs "$(nproc)"
      - name: Write release notes
        run: |
          python - <<'EOF'
          import json
          m = json.load(open("dist/manifest.json"))
          lines = [
              f"Dataset {m['dataset_version']} (question format v{m['schema_version']}).",
              "",
              f"- {m['question_count']} questions, {m['image_count']} images",
              f"- {m['needs_review_count']} questions flagged needs_review (shown as images on the site)",
              "",
              "| Set | Questions |",
              "| --- | --- |",
          ]
          lines += [f"| {s} | {n} |" for s, n in m["sets"].items()]
          open("dist/NOTES.md", "w").write("\n".join(lines) + "\n")
          EOF
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/questions.json dist/images.zip dist/manifest.json \
            --title "Question bank ${GITHUB_REF_NAME}" \
            --notes-file dist/NOTES.md
