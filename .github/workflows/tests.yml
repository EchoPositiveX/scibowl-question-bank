name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Parse every PDF (text only) and run the content checks
        run: |
          python -m scibowl_qb.parse --no-images --jobs "$(nproc)"
          python -m scibowl_qb.checks output/questions.json
